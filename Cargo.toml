[package]
name = "jobq"
version = "0.1.0"
edition = "2021"
description = "A distributed job queue: leases, heartbeats, retries with backoff, dead-letter queue, delayed and priority jobs, WAL persistence"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
